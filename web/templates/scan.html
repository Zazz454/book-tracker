{{define "title"}}Scan ISBN - My Library{{end}}

{{define "content"}}
<div class="scan-page">
    <h1>Scan ISBN Barcode</h1>

    <div id="securityNotice" class="notice notice-warning" style="display:none">
        <strong>Camera requires HTTPS.</strong> You're on an insecure connection.
        Use the manual ISBN entry below, or access this page via HTTPS or localhost.
    </div>

    <div id="scannerRegion" style="margin: 1rem 0;"></div>

    <div class="scanner-controls">
        <button class="btn btn-primary" id="startScan" onclick="toggleScanner()">Start Camera</button>
    </div>

    <div class="manual-entry">
        <h3>Or enter ISBN manually</h3>
        <div class="isbn-row">
            <input type="text" id="manualISBN" placeholder="Enter ISBN..." class="form-input"
                   inputmode="numeric" pattern="[0-9Xx-]*">
            <button class="btn btn-primary" onclick="lookupManualISBN()">Lookup</button>
        </div>
    </div>

    <div class="lookup-result" id="lookupResult" style="display:none">
        <h3>Book Found</h3>
        <div class="result-card" id="resultCard"></div>
        <div class="result-actions">
            <button class="btn" onclick="dismissResult()">Cancel</button>
            <button class="btn btn-primary" onclick="addFoundBook()">Add to Library</button>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let foundBook = null;
let html5Scanner = null;
let scanning = false;

// Check secure context on load
(function() {
    const isSecure = window.isSecureContext;
    const notice = document.getElementById('securityNotice');
    if (!isSecure) {
        notice.style.display = 'block';
        // Disable start button since camera won't work
        document.getElementById('startScan').disabled = true;
        document.getElementById('startScan').textContent = 'Camera unavailable (no HTTPS)';
    }
})();

async function toggleScanner() {
    const btn = document.getElementById('startScan');

    if (scanning) {
        await stopScanner();
        return;
    }

    btn.textContent = 'Starting...';
    btn.disabled = true;

    try {
        html5Scanner = new Html5Qrcode('scannerRegion');

        const config = {
            fps: 10,
            qrbox: { width: 280, height: 120 },
            formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E
            ]
        };

        await html5Scanner.start(
            { facingMode: 'environment' },
            config,
            onScanSuccess,
            function() { /* ignore scan failures, keep trying */ }
        );

        scanning = true;
        btn.textContent = 'Stop Camera';
        btn.disabled = false;
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-danger');

    } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Start Camera';

        if (err.toString().includes('NotAllowedError')) {
            alert('Camera permission denied. Please allow camera access and try again.');
        } else if (err.toString().includes('NotFoundError')) {
            alert('No camera found on this device.');
        } else {
            alert('Could not start camera: ' + err);
        }
    }
}

async function stopScanner() {
    const btn = document.getElementById('startScan');

    if (html5Scanner) {
        try {
            await html5Scanner.stop();
        } catch (e) { /* ignore */ }
        html5Scanner.clear();
        html5Scanner = null;
    }

    scanning = false;
    btn.textContent = 'Start Camera';
    btn.classList.remove('btn-danger');
    btn.classList.add('btn-primary');
}

async function onScanSuccess(decodedText) {
    // Clean up the ISBN (remove hyphens/spaces)
    const isbn = decodedText.replace(/[-\s]/g, '');

    // Stop scanning immediately
    await stopScanner();

    // Show in manual input
    document.getElementById('manualISBN').value = isbn;

    // Trigger lookup
    await lookupAndShow(isbn);
}

async function lookupAndShow(isbn) {
    const resultDiv = document.getElementById('lookupResult');
    const card = document.getElementById('resultCard');

    card.innerHTML = '<p>Looking up ISBN...</p>';
    resultDiv.style.display = 'block';

    try {
        const resp = await fetch('/api/lookup/' + encodeURIComponent(isbn));
        if (!resp.ok) throw new Error('Not found');
        foundBook = await resp.json();

        card.innerHTML =
            '<div class="result-info">' +
                (foundBook.cover_url ? '<img src="' + foundBook.cover_url + '" class="result-cover">' : '') +
                '<div>' +
                    '<strong>' + escapeHtml(foundBook.title) + '</strong><br>' +
                    'by ' + escapeHtml(foundBook.author) + '<br>' +
                    (foundBook.year ? 'Published: ' + foundBook.year + '<br>' : '') +
                    (foundBook.pages ? foundBook.pages + ' pages' : '') +
                '</div>' +
            '</div>';
    } catch (e) {
        foundBook = null;
        card.innerHTML = '<p class="text-muted">ISBN not found: ' + escapeHtml(isbn) + '</p>';
    }
}

async function lookupManualISBN() {
    const isbn = document.getElementById('manualISBN').value.trim();
    if (!isbn) return;
    await lookupAndShow(isbn);
}

async function addFoundBook() {
    if (!foundBook) return;
    try {
        const resp = await fetch('/api/books', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                title: foundBook.title,
                author: foundBook.author,
                isbn: foundBook.isbn,
                genre: foundBook.genre || '',
                pages: foundBook.pages || 0,
                year: foundBook.year || 0
            })
        });
        if (resp.ok) {
            const book = await resp.json();
            window.location = '/books/' + book.id;
        } else {
            alert('Failed to add book');
        }
    } catch (e) {
        alert('Error adding book: ' + e.message);
    }
}

function dismissResult() {
    document.getElementById('lookupResult').style.display = 'none';
    foundBook = null;
}

function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}
</script>
{{end}}
