version: '3.8'

services:
  library:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Persist data outside container
      - ./data:/app/data
    environment:
      - LIBRARY_DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - library
    restart: unless-stopped
    profiles: ["production"]

volumes:
  library_data:
    driver: local